<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hippocampus · Piso 4 · Navegación</title>
<style>
:root{
  --bg:#E9ECEF; --floor:#FFFFFF; --wall:#7C8794; --room:rgba(120,140,170,.10);
  --ink:#1D2630; --muted:#5F6B78; --sheet:#FFFFFF; --chip:#EEF1F4; --line:#DDE2E7;
  --route:#1A82E6; --routeCase:#0B4C93; --acc:#12A150; --accCase:#0A6634; --stairs:#F08A24;
  --banner:#1F6FD1; --here:#1A82E6; --shadow:0 6px 24px rgba(10,30,60,.18);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171B20; --floor:#2A3038; --wall:#8996A3; --room:rgba(150,170,200,.10);
  --ink:#ECEFF2; --muted:#A3AEB9; --sheet:#22272E; --chip:#2E353D; --line:#39414A;
  --banner:#1859A8; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171B20;--floor:#2A3038;--wall:#8996A3;--room:rgba(150,170,200,.10);--ink:#ECEFF2;--muted:#A3AEB9;--sheet:#22272E;--chip:#2E353D;--line:#39414A;--banner:#1859A8;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",Arial,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:var(--bg)}
#map{width:100%;height:100%;display:block;transform-origin:50% 72%;transition:transform .6s ease}
body.nav #map{transform:perspective(900px) rotateX(38deg) scale(1.35)}
@media (prefers-reduced-motion:reduce){#map{transition:none}}
.wall{fill:var(--wall)}
.floorband{fill:none;stroke:var(--floor);stroke-linecap:round;stroke-linejoin:round;stroke-width:213}
.floorpoly{fill:var(--floor)}
.room{fill:var(--room)}
.corrlbl{fill:var(--muted);font:600 15px "Barlow Semi Condensed",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.r-case{fill:none;stroke:var(--routeCase);stroke-linecap:round;stroke-linejoin:round}
.r-main{fill:none;stroke:var(--route);stroke-linecap:round;stroke-linejoin:round}
body.acc .r-case{stroke:var(--accCase)} body.acc .r-main{stroke:var(--acc)}
.r-done{fill:none;stroke:#9AA6B2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.r-stairs{fill:none;stroke:var(--stairs);stroke-linecap:butt}
.r-flow{fill:none;stroke:#fff;stroke-linecap:round;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion:reduce){.r-flow{animation:none}}
.entr{fill:var(--sheet);stroke:var(--route);stroke-width:3}
.mk{cursor:pointer}
.mk .ring{fill:#fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.mk .ico{fill:var(--route)}
.mk .emoji{font-size:17px;text-anchor:middle;dominant-baseline:central}
.mk .name{font:700 13px "Barlow Semi Condensed",Arial,sans-serif;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.mk.sel .ring{fill:var(--route)}
body.acc .mk.sel .ring{fill:var(--acc)}
.mk.far .name{display:none}
body.routing .mk:not(.sel):not(.org){opacity:.55}
.pin .body{fill:var(--route);stroke:#fff;stroke-width:2.5} body.acc .pin .body{fill:var(--acc)}
.org-dot{fill:var(--here);stroke:#fff;stroke-width:3}
.org-halo{fill:var(--here);opacity:.2}
.me .arrow{fill:var(--here);stroke:#fff;stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
body.acc .me .arrow{fill:var(--acc)}
.ui{position:fixed;left:0;right:0;z-index:5;pointer-events:none}
.ui>*{pointer-events:auto}
#top{top:calc(env(safe-area-inset-top,0px) + 10px);padding:0 12px;display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--sheet);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border:0;font:inherit;font-size:16px;color:var(--muted);text-align:left;cursor:pointer}
.floor{background:var(--ink);color:var(--sheet);border-radius:12px;padding:10px 12px;font:700 15px "Barlow Semi Condensed",Arial;box-shadow:var(--shadow)}
body.nav #top{display:none}
#banner{top:calc(env(safe-area-inset-top,0px) + 10px);padding:0 10px;display:none}
body.nav #banner{display:block}
.bn{background:var(--banner);color:#fff;border-radius:16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;padding:12px 14px}
.bn .big{font-size:40px;line-height:1;width:52px;text-align:center;flex:none}
.bn .dist{font:700 30px "Barlow Semi Condensed",Arial;line-height:1}
.bn .txt{font-size:17px;font-weight:600;line-height:1.2;margin-top:2px}
.bn.stairs{background:#C96A12} .bn.lift{background:#0E8A6B} .bn.arrive{background:#12813F}
.then{display:inline-block;margin:6px 0 0 8px;background:rgba(10,40,80,.85);color:#fff;border-radius:10px;padding:5px 10px;font-size:14px;font-weight:600}
.ent .dot{fill:#F2C230;stroke:#2B2930;stroke-width:2.5}
.ent .hit{fill:transparent;stroke:none}
.ent{cursor:move}
.lead{stroke:var(--muted);stroke-dasharray:4 4;fill:none}
body.editing .mk{cursor:grab}
#editFab{bottom:calc(var(--sheetH,200px) + 70px);font-size:19px}
body.nav #editFab{display:none}
body.editing #editFab{background:#F2C230;color:#2B2930}
.aer{display:block;position:relative;width:100%;margin:8px 0 2px;border:0;padding:0;border-radius:14px;overflow:hidden;cursor:zoom-in;background:var(--chip)}
.aer img{display:block;width:100%;height:84px;object-fit:cover}
.aer span{position:absolute;left:10px;bottom:8px;color:#fff;font:700 15px "Barlow Semi Condensed",Arial;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.wp .wdot{fill:var(--route);stroke:#fff;stroke-width:2.5}
.wp .hit{fill:transparent;stroke:none}
.eline{stroke:var(--route);opacity:.55;stroke-dasharray:6 5}
.eline.st{stroke:var(--stairs)}
body.editing .shp{cursor:move}
body.editing .shp .water{stroke:var(--route);stroke-width:3;stroke-dasharray:6 4}
.ur-box{fill:rgba(26,130,230,.10);stroke:var(--wall);stroke-width:3;vector-effect:non-scaling-stroke}
.ur-name{font:700 17px "Barlow Semi Condensed",Arial,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.ur-handle{fill:#fff;stroke:var(--route);stroke-width:2.5;cursor:nwse-resize;vector-effect:non-scaling-stroke}
body.editing .uroom{cursor:move}
body.editing[data-tool="rect"] #stage,body.editing[data-tool="place"] #stage{cursor:crosshair}
.tools button{font-size:13.5px;padding:9px 2px}
#eForm input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
#stage,#map{touch-action:none}
html,body{touch-action:manipulation}
.fab{position:fixed;right:12px;z-index:5;width:46px;height:46px;border-radius:50%;border:0;background:var(--sheet);color:var(--ink);box-shadow:var(--shadow);font:700 20px Arial;cursor:pointer;display:grid;place-items:center}
#recenter{bottom:calc(var(--sheetH,200px) + 16px)}
#scale{position:fixed;left:12px;bottom:calc(var(--sheetH,200px) + 18px);z-index:5;pointer-events:none;font:700 12px Arial;color:var(--ink);text-shadow:0 0 3px var(--bg)}
#scale .bar{height:6px;border:2.5px solid var(--ink);border-top:0;margin-top:2px}
#sheet{bottom:0;padding:0 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
.card{background:var(--sheet);border-radius:20px 20px 16px 16px;box-shadow:var(--shadow);padding:10px 14px 14px;max-height:62vh;overflow:auto}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
h2{margin:0;font:700 22px "Barlow Semi Condensed",Arial;line-height:1.15}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.row{display:flex;gap:8px;align-items:center}
.places{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 4px;scroll-snap-type:x mandatory}
.pl{flex:none;width:118px;scroll-snap-align:start;border:0;background:var(--chip);border-radius:14px;padding:0 0 8px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;overflow:hidden}
.pl img,.pl .ph{width:118px;height:78px;object-fit:cover;display:block;background:var(--line)}
.pl .ph{display:grid;place-items:center;font-size:30px}
.pl b{display:block;font:600 14px "Barlow Semi Condensed",Arial;padding:6px 8px 0;line-height:1.15}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -14px 8px;padding:0 14px}
.gal img{flex:none;width:86%;max-width:420px;height:190px;object-fit:cover;border-radius:14px;scroll-snap-align:center;cursor:zoom-in}
.gal.one img{width:100%}
.btn{font:700 17px "Barlow Semi Condensed",Arial;border:0;border-radius:14px;padding:13px 16px;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.go{background:var(--route);color:#fff;flex:1} body.acc .btn.go{background:var(--acc)}
.btn.stop{background:#E5484D;color:#fff}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font:600 15px "Barlow",Arial;color:var(--muted);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.eta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.eta .t{font:700 30px "Barlow Semi Condensed",Arial;color:var(--acc)}
body:not(.acc) .eta .t{color:var(--route)}
.eta .m{color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:13px;font-weight:600;background:var(--chip);color:var(--muted);border-radius:8px;padding:3px 8px;margin:6px 6px 0 0}
select{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);flex:1;min-width:0}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li button{width:100%;display:flex;gap:12px;align-items:center;border:0;background:none;padding:8px 2px;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.list img,.list .ph{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip);display:grid;place-items:center;font-size:24px}
.list b{display:block;font:600 16px "Barlow Semi Condensed",Arial}
.list small{color:var(--muted)}
.navbar{display:flex;align-items:center;gap:10px}
.navbar .eta{flex:1}
.ctrl{width:46px;height:46px;border-radius:12px;border:0;background:var(--chip);color:var(--ink);font:700 18px Arial;cursor:pointer}
button:focus-visible{outline:3px solid var(--route);outline-offset:2px}
#viewer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:100%;border-radius:10px}
#viewer button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px}
</style>
</head>

function toWorld(cx,cy){const b=box(),k=V.w/b.width;const dx=(cx-b.left-b.width/2)*k,dy=(cy-b.top-b.height/2)*k;
  const r=-V.rot*Math.PI/180;return{x:V.cx+dx*Math.cos(r)-dy*Math.sin(r),y:V.cy+dx*Math.sin(r)+dy*Math.cos(r)}}

  else if(ptr.size===2){const [a,c]=[...ptr.values()],d=Math.hypot(a.x-c.x,a.y-c.y),m={x:(a.x+c.x)/2,y:(a.y+c.y)/2};

    g.appendChild(el("circle",{class:"hit",r:12}));g.appendChild(el("circle",{class:"wdot",r:5.5}));mkG.appendChild(g)}
  drawLeads();apply()}
function applyShapes(){document.querySelectorAll(".shp").forEach(g=>{const o=shapes[g.dataset.id]||{dx:0,dy:0};g.setAttribute("transform",`translate(${o.dx} ${o.dy})`)})}
function updateLines(n){routeG.querySelectorAll(`line[data-a="${n}"]`).forEach(l=>{l.setAttribute("x1",N[n].x);l.setAttribute("y1",N[n].y)});
  routeG.querySelectorAll(`line[data-b="${n}"]`).forEach(l=>{l.setAttribute("x2",N[n].x);l.setAttribute("y2",N[n].y)});
  const l=routeG.querySelector(`line.lead[data-n="${n}"]`);if(l&&PL[n]){l.setAttribute("x1",PL[n].tag.x);l.setAttribute("y1",PL[n].tag.y);l.setAttribute("x2",N[n].x);l.setAttribute("y2",N[n].y)}}
function redrawAll(){applyShapes();refreshFloor();renderRooms();buildMarkers();if(editing)addEnt();else if(route)drawRoute()}
function applySaved(d){
  PLACES.filter(p=>p.user).map(p=>p.node).forEach(removeUserPlace);
  for(const k in BASE_ADJ)adj[k]=[...BASE_ADJ[k]];
  PLACES.forEach(p=>{const o=(d&&d.tags&&d.tags[p.node])||BASE.tags[p.node];p.tag.x=o.x;p.tag.y=o.y});
  for(const k in BASE.nodes){if(!N[k])continue;const q=(d&&d.nodes&&d.nodes[k])||BASE.nodes[k];N[k].x=q.x;N[k].y=q.y}
  shapes=JSON.parse(JSON.stringify((d&&d.shapes)||{}));
  ((d&&d.places)||[]).forEach(addUserPlace);
  rooms=((d&&d.rooms)||[]).map(r=>({...r}));dirty=false;redrawAll()}
function snapshot(){const d={tags:{},nodes:{},shapes:JSON.parse(JSON.stringify(shapes)),rooms:rooms.map(r=>({id:r.id,x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.w),h:Math.round(r.h),name:r.name||""})),places:[],updatedAt:new Date().toISOString()};
  PLACES.forEach(p=>{if(p.user){d.places.push({id:p.node,name:p.name,x:Math.round(p.tag.x),y:Math.round(p.tag.y),ex:Math.round(N[p.node].x),ey:Math.round(N[p.node].y)});return}
    const b=BASE.tags[p.node];
    if(Math.round(p.tag.x)!==b.x||Math.round(p.tag.y)!==b.y)d.tags[p.node]={x:Math.round(p.tag.x),y:Math.round(p.tag.y)}});
  for(const k in BASE.nodes){if(!N[k])continue;const c=BASE.nodes[k];if(Math.round(N[k].x)!==c.x||Math.round(N[k].y)!==c.y)d.nodes[k]={x:Math.round(N[k].x),y:Math.round(N[k].y)}}
  return d}
const TOOLS=[["move","✋ Mover"],["rect","▭ Recuadro"],["place","📍 Lugar"],["del","🗑 Borrar"]];
const HELP={move:"Arrastra el <b>círculo</b> (sector), el <b>punto amarillo</b> (entrada), los <b>puntos azules</b> (curvas de la ruta)"+(D.shapesHelp||"")+", o un recuadro. La esquina blanca de un recuadro cambia su tamaño. Sobre el mapa vacío, arrastra para moverte.",
  rect:"Arrastra sobre el mapa para dibujar un recuadro (sala, local, zona). Después le pones nombre.",
  place:"Toca el mapa donde va el nuevo lugar. Se conecta solo al camino más cercano y aparece como destino.",
  del:"Toca un recuadro o un lugar que hayas agregado para borrarlo. Los lugares del plano original no se borran: muévelos."};
function setMsg(m){const e=$("eMsg");if(e)e.innerHTML=m}
function editSheet(){
  card.innerHTML=`<div class="grip"></div><div class="row"><h2 style="flex:1">Editar ${esc(D.floorName)}</h2><span class="sub" id="eDirty"></span></div>
  <div class="seg tools" role="radiogroup" aria-label="Herramienta">${TOOLS.map(([k,l])=>`<button role="radio" data-t="${k}" aria-checked="${tool===k}">${l}</button>`).join("")}</div>
  <p class="sub" id="eHelp">${HELP[tool]}</p>
  <div id="eForm"></div>
  <p class="sub" id="eMsg" style="margin-top:6px;font-weight:600"></p>
  <div class="row" style="margin-top:8px"><button class="btn" id="eUndo">↺ Deshacer</button><button class="btn go" id="eSave">💾 Guardar</button><button class="btn" id="eDone">✓ Listo</button></div>`;
  card.querySelectorAll(".tools button").forEach(b=>b.onclick=()=>{tool=b.dataset.t;cancelPending();card.querySelectorAll(".tools button").forEach(x=>x.setAttribute("aria-checked",x===b));$("eHelp").innerHTML=HELP[tool];body.dataset.tool=tool});
  $("eUndo").onclick=()=>{cancelPending();applySaved(savedPos);setMsg("Volviste a la última versión guardada.");markDirty(false)};
  $("eSave").onclick=saveEdit;$("eDone").onclick=()=>toggleEdit(false);
  body.dataset.tool=tool;afterSheet(()=>{})}
function markDirty(v=true){dirty=v;const e=$("eDirty");if(e)e.textContent=v?"● sin guardar":""}
function askName(label,def,onOk){const f=$("eForm");
  f.innerHTML=`<div class="row" style="margin:8px 0"><input id="eName" maxlength="40" placeholder="${esc(label)}" value="${esc(def||"")}" aria-label="${esc(label)}"><button class="btn go" id="eOk" style="flex:none">Agregar</button><button class="btn" id="eNo">✕</button></div>`;
  const i=$("eName");setTimeout(()=>i.focus(),50);
  const ok=()=>{onOk(i.value.trim());f.innerHTML=""};$("eOk").onclick=ok;i.onkeydown=e=>{if(e.key==="Enter")ok()};
  $("eNo").onclick=cancelPending;afterSheet(()=>{})}
function cancelPending(){if(pending&&pending.kind==="rect"&&pending.temp){rooms=rooms.filter(r=>r!==pending.room);renderRooms()}
  mkG.querySelectorAll(".tmp").forEach(e=>e.remove());pending=null;const f=$("eForm");if(f)f.innerHTML=""}
async function saveEdit(){if(!dbE){setMsg("No se puede guardar en este momento.");return}
  setMsg("Guardando…");const d=snapshot();
  try{await dbE.doc(EKEY).set(d);savedPos=d;markDirty(false);setMsg("Guardado ✓")}
  catch(e){setMsg(e&&e.code==="not_granted"?"No tienes permiso para guardar.":"No se pudo guardar. Intenta de nuevo.")}}
function toggleEdit(on){
  if(!on&&dirty&&!confirmLeave())return;
  editing=on;body.classList.toggle("editing",on);$("editFab").setAttribute("aria-pressed",on);cancelPending();
  if(on){dest=null;route=null;body.classList.remove("routing");routeG.innerHTML="";mkG.querySelectorAll(".pin,.me").forEach(e=>e.remove());markSel();renderRooms();addEnt();editSheet()}
  else{mkG.querySelectorAll(".ent").forEach(e=>e.remove());routeG.innerHTML="";renderRooms();idle()}}
let leaveArm=false;
function confirmLeave(){if(leaveArm){leaveArm=false;applySaved(savedPos);return true}leaveArm=true;setMsg("Tienes cambios sin guardar. Toca ✓ Listo otra vez para salir sin guardar.");setTimeout(()=>leaveArm=false,4000);return false}
$("editFab").onclick=()=>toggleEdit(!editing);
$("stage").addEventListener("pointerdown",e=>{if(!editing||e.button>0)return;
  const w=toWorld(e.clientX,e.clientY);
  if(tool==="move"){const t=e.target.closest(".mk,.ent,.ur-handle,.uroom,.shp");if(!t)return;e.stopPropagation();e.preventDefault();
    if(t.classList.contains("shp")){const id=t.dataset.id,o=shapes[id]||(shapes[id]={dx:0,dy:0});dragItem={kind:"shape",id:e.pointerId,sid:id,lx:w.x,ly:w.y};return}
    if(t.classList.contains("ur-handle")){const r=rooms.find(x=>x.id===t.parentNode.dataset.id);dragItem={kind:"resize",room:r,id:e.pointerId};return}
    if(t.classList.contains("uroom")){const r=rooms.find(x=>x.id===t.dataset.id);dragItem={kind:"room",room:r,id:e.pointerId,dx:r.x-w.x,dy:r.y-w.y};return}
    dragItem={kind:"pt",el:t,id:e.pointerId,dx:+t.dataset.x-w.x,dy:+t.dataset.y-w.y};return}
  if(tool==="rect"){e.stopPropagation();e.preventDefault();cancelPending();
    const r={id:"r"+Date.now().toString(36),x:w.x,y:w.y,w:1,h:1,name:""};rooms.push(r);pending={kind:"rect",room:r,temp:true,ox:w.x,oy:w.y};
    dragItem={kind:"draw",id:e.pointerId};renderRooms();return}
  if(tool==="place"){e.stopPropagation();e.preventDefault();cancelPending();
    const m=el("g",{class:"mk tmp"});m.dataset.x=w.x;m.dataset.y=w.y;m.appendChild(el("circle",{class:"ring",r:14}));const tx=el("text",{class:"emoji"});tx.textContent="📍";m.appendChild(tx);mkG.appendChild(m);apply();
    pending={kind:"place",x:w.x,y:w.y};
    askName("Nombre del lugar","",name=>{mkG.querySelectorAll(".tmp").forEach(x=>x.remove());if(!name){pending=null;return}
      addUserPlace({id:"u"+Date.now().toString(36),name,x:pending.x,y:pending.y,ex:pending.x,ey:pending.y});pending=null;markDirty();redrawAll();setMsg(`"${esc(name)}" agregado. Ajusta su punto amarillo a la entrada.`)});return}
  if(tool==="del"){const t=e.target.closest(".uroom,.mk");if(!t)return;e.stopPropagation();e.preventDefault();
    if(t.classList.contains("uroom")){rooms=rooms.filter(r=>r.id!==t.dataset.id);markDirty();renderRooms();setMsg("Recuadro borrado.");return}
    const p=PL[t.dataset.node];if(p&&p.user){removeUserPlace(p.node);markDirty();redrawAll();setMsg(`"${esc(p.name)}" borrado.`)}
    else setMsg("Ese lugar es del plano original: no se borra, pero puedes moverlo.")}
},true);
window.addEventListener("pointermove",e=>{if(!dragItem||e.pointerId!==dragItem.id)return;const w=toWorld(e.clientX,e.clientY);
  if(dragItem.kind==="draw"){const P=pending,r=P.room;r.x=Math.min(P.ox,w.x);r.y=Math.min(P.oy,w.y);r.w=Math.abs(w.x-P.ox);r.h=Math.abs(w.y-P.oy);renderRooms();return}
  if(dragItem.kind==="room"){const r=dragItem.room;r.x=w.x+dragItem.dx;r.y=w.y+dragItem.dy;markDirty();renderRooms();return}
  if(dragItem.kind==="shape"){const o=shapes[dragItem.sid],ddx=w.x-dragItem.lx,ddy=w.y-dragItem.ly;dragItem.lx=w.x;dragItem.ly=w.y;o.dx+=ddx;o.dy+=ddy;
    ((D.shapeLinks||{})[dragItem.sid]||[]).forEach(n=>{if(!PL[n])return;PL[n].tag.x+=ddx;PL[n].tag.y+=ddy;const m=mkG.querySelector(`.mk[data-node="${n}"]`);if(m){m.dataset.x=PL[n].tag.x;m.dataset.y=PL[n].tag.y}updateLines(n)});
    applyShapes();markDirty();apply();return}
  if(dragItem.kind==="resize"){const r=dragItem.room;r.w=Math.max(14,w.x-r.x);r.h=Math.max(14,w.y-r.y);markDirty();renderRooms();return}
  const x=w.x+dragItem.dx,y=w.y+dragItem.dy,t=dragItem.el,n=t.dataset.node;t.dataset.x=x;t.dataset.y=y;
  if(t.classList.contains("mk")){PL[n].tag.x=x;PL[n].tag.y=y}
  else{N[n].x=x;N[n].y=y;refreshFloor();if(n===origin){const o=mkG.querySelector(".org");if(o){o.dataset.x=x;o.dataset.y=y}}}
  updateLines(n);markDirty();apply()});
const endDrag=e=>{if(!dragItem||e.pointerId!==dragItem.id)return;const d=dragItem;dragItem=null;
  if(d.kind==="pt"&&d.el.classList.contains("ent")&&PL[d.el.dataset.node]?.user)connectUser(d.el.dataset.node);
  if(d.kind==="draw"){const r=pending.room;if(r.w<12||r.h<12){cancelPending();setMsg("Arrastra un poco más para dibujar el recuadro.");return}
    askName("Nombre del recuadro (opcional)","",name=>{r.name=name;pending=null;markDirty();renderRooms();setMsg("Recuadro agregado. Puedes moverlo o cambiar su tamaño con ✋ Mover.")})}};
window.addEventListener("pointerup",endDrag);window.addEventListener("pointercancel",endDrag);
(async()=>{if(window.parent!==window)return;dbE={doc:key=>({
async get(){const raw=localStorage.getItem("navinside:"+key);return{exists:raw!==null,data:()=>raw===null?null:JSON.parse(raw)}},
async set(value){localStorage.setItem("navinside:"+key,JSON.stringify(value))}
})};
  try{const s=await dbE.doc(EKEY).get();if(s.exists){savedPos=s.data();applySaved(savedPos)}}catch(e){}})();

</script>
<script src="navinside-map-config.js"></script>
<script src="navinside-route-guidance.js"></script>
<script src="navinside-map-bridge.js"></script>
