<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hippocampus · Nivel 1 · Navegación</title>

<style>
:root{
  --bg:#E9ECEF; --floor:#FFFFFF; --wall:#7C8794; --room:rgba(120,140,170,.10);
  --ink:#1D2630; --muted:#5F6B78; --sheet:#FFFFFF; --chip:#EEF1F4; --line:#DDE2E7;
  --route:#1A82E6; --routeCase:#0B4C93; --acc:#12A150; --accCase:#0A6634; --stairs:#F08A24;
  --banner:#1F6FD1; --here:#1A82E6; --shadow:0 6px 24px rgba(10,30,60,.18);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171B20; --floor:#2A3038; --wall:#8996A3; --room:rgba(150,170,200,.10);
  --ink:#ECEFF2; --muted:#A3AEB9; --sheet:#22272E; --chip:#2E353D; --line:#39414A;
  --banner:#1859A8; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171B20;--floor:#2A3038;--wall:#8996A3;--room:rgba(150,170,200,.10);--ink:#ECEFF2;--muted:#A3AEB9;--sheet:#22272E;--chip:#2E353D;--line:#39414A;--banner:#1859A8;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",Arial,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:var(--bg)}
#map{width:100%;height:100%;display:block;transform-origin:50% 72%;transition:transform .6s ease}
body.nav #map{transform:perspective(900px) rotateX(38deg) scale(1.35)}
@media (prefers-reduced-motion:reduce){#map{transition:none}}
.wall{fill:var(--wall)}
.floorband{fill:none;stroke:var(--floor);stroke-linecap:round;stroke-linejoin:round;stroke-width:44}
.floorpoly{fill:var(--floor)}
.room{fill:var(--room)}
.corrlbl{fill:var(--muted);font:600 15px "Barlow Semi Condensed",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.r-case{fill:none;stroke:var(--routeCase);stroke-linecap:round;stroke-linejoin:round}
.r-main{fill:none;stroke:var(--route);stroke-linecap:round;stroke-linejoin:round}
body.acc .r-case{stroke:var(--accCase)} body.acc .r-main{stroke:var(--acc)}
.r-done{fill:none;stroke:#9AA6B2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.r-stairs{fill:none;stroke:var(--stairs);stroke-linecap:butt}
.r-flow{fill:none;stroke:#fff;stroke-linecap:round;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion:reduce){.r-flow{animation:none}}
.entr{fill:var(--sheet);stroke:var(--route);stroke-width:3}
.mk{cursor:pointer}
.mk .ring{fill:#fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.mk .ico{fill:var(--route)}
.mk .emoji{font-size:17px;text-anchor:middle;dominant-baseline:central}
.mk .name{font:700 13px "Barlow Semi Condensed",Arial,sans-serif;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.mk.sel .ring{fill:var(--route)}
body.acc .mk.sel .ring{fill:var(--acc)}
.mk.far .name{display:none}
body.routing .mk:not(.sel):not(.org){opacity:.55}
.pin .body{fill:var(--route);stroke:#fff;stroke-width:2.5} body.acc .pin .body{fill:var(--acc)}
.org-dot{fill:var(--here);stroke:#fff;stroke-width:3}
.org-halo{fill:var(--here);opacity:.2}
.me .arrow{fill:var(--here);stroke:#fff;stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
body.acc .me .arrow{fill:var(--acc)}
.ui{position:fixed;left:0;right:0;z-index:5;pointer-events:none}
.ui>*{pointer-events:auto}
#top{top:calc(env(safe-area-inset-top,0px) + 10px);padding:0 12px;display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--sheet);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border:0;font:inherit;font-size:16px;color:var(--muted);text-align:left;cursor:pointer}
.floor{background:var(--ink);color:var(--sheet);border-radius:12px;padding:10px 12px;font:700 15px "Barlow Semi Condensed",Arial;box-shadow:var(--shadow)}
body.nav #top{display:none}
#banner{top:calc(env(safe-area-inset-top,0px) + 10px);padding:0 10px;display:none}
body.nav #banner{display:block}
.bn{background:var(--banner);color:#fff;border-radius:16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;padding:12px 14px}
.bn .big{font-size:40px;line-height:1;width:52px;text-align:center;flex:none}
.bn .dist{font:700 30px "Barlow Semi Condensed",Arial;line-height:1}
.bn .txt{font-size:17px;font-weight:600;line-height:1.2;margin-top:2px}
.bn.stairs{background:#C96A12} .bn.lift{background:#0E8A6B} .bn.arrive{background:#12813F}
.then{display:inline-block;margin:6px 0 0 8px;background:rgba(10,40,80,.85);color:#fff;border-radius:10px;padding:5px 10px;font-size:14px;font-weight:600}
.ent .dot{fill:#F2C230;stroke:#2B2930;stroke-width:2.5}
.ent .hit{fill:transparent;stroke:none}
.ent{cursor:move}
.lead{stroke:var(--muted);stroke-dasharray:4 4;fill:none}
body.editing .mk{cursor:grab}
#editFab{bottom:calc(var(--sheetH,200px) + 70px);font-size:19px}
body.nav #editFab{display:none}
body.editing #editFab{background:#F2C230;color:#2B2930}
.fab{position:fixed;right:12px;z-index:5;width:46px;height:46px;border-radius:50%;border:0;background:var(--sheet);color:var(--ink);box-shadow:var(--shadow);font:700 20px Arial;cursor:pointer;display:grid;place-items:center}
#recenter{bottom:calc(var(--sheetH,200px) + 16px)}
#scale{position:fixed;left:12px;bottom:calc(var(--sheetH,200px) + 18px);z-index:5;pointer-events:none;font:700 12px Arial;color:var(--ink);text-shadow:0 0 3px var(--bg)}
#scale .bar{height:6px;border:2.5px solid var(--ink);border-top:0;margin-top:2px}
#sheet{bottom:0;padding:0 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
.card{background:var(--sheet);border-radius:20px 20px 16px 16px;box-shadow:var(--shadow);padding:10px 14px 14px;max-height:62vh;overflow:auto}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
h2{margin:0;font:700 22px "Barlow Semi Condensed",Arial;line-height:1.15}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.row{display:flex;gap:8px;align-items:center}
.places{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 4px;scroll-snap-type:x mandatory}
.pl{flex:none;width:118px;scroll-snap-align:start;border:0;background:var(--chip);border-radius:14px;padding:0 0 8px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;overflow:hidden}
.pl img,.pl .ph{width:118px;height:78px;object-fit:cover;display:block;background:var(--line)}
.pl .ph{display:grid;place-items:center;font-size:30px}
.pl b{display:block;font:600 14px "Barlow Semi Condensed",Arial;padding:6px 8px 0;line-height:1.15}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -14px 8px;padding:0 14px}
.gal img{flex:none;width:86%;max-width:420px;height:190px;object-fit:cover;border-radius:14px;scroll-snap-align:center;cursor:zoom-in}
.gal.one img{width:100%}
.btn{font:700 17px "Barlow Semi Condensed",Arial;border:0;border-radius:14px;padding:13px 16px;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.go{background:var(--route);color:#fff;flex:1} body.acc .btn.go{background:var(--acc)}
.btn.stop{background:#E5484D;color:#fff}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font:600 15px "Barlow",Arial;color:var(--muted);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.eta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.eta .t{font:700 30px "Barlow Semi Condensed",Arial;color:var(--acc)}
body:not(.acc) .eta .t{color:var(--route)}
.eta .m{color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:13px;font-weight:600;background:var(--chip);color:var(--muted);border-radius:8px;padding:3px 8px;margin:6px 6px 0 0}
select{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);flex:1;min-width:0}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li button{width:100%;display:flex;gap:12px;align-items:center;border:0;background:none;padding:8px 2px;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.list img,.list .ph{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip);display:grid;place-items:center;font-size:24px}
.list b{display:block;font:600 16px "Barlow Semi Condensed",Arial}
.list small{color:var(--muted)}
.navbar{display:flex;align-items:center;gap:10px}
.navbar .eta{flex:1}
.ctrl{width:46px;height:46px;border-radius:12px;border:0;background:var(--chip);color:var(--ink);font:700 18px Arial;cursor:pointer}
button:focus-visible{outline:3px solid var(--route);outline-offset:2px}
#viewer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:100%;border-radius:10px}
#viewer button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px}
</style>
</head>

const N=D.nodes, SCALE_M=0.11, WALK={normal:1.2,accesible:0.9}, LIFT_S=40;
const NS="http://www.w3.org/2000/svg";
const el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const $=id=>document.getElementById(id);
const svg=$("map"), world=$("world"), mkG=$("mkG"), routeG=$("routeG"), card=$("card"), body=document.body;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

(function(){const g=$("floorG");
  D.bands.forEach(b=>g.appendChild(el("polyline",{class:"floorband",points:b.map(k=>N[k].x+","+N[k].y).join(" ")})));
  g.appendChild(el("path",{class:"floorpoly",d:"M1059 973 L1044 977 L1032 989 L1028 1004 L1036 1429 L1040 1443 L1049 1453 L1054 1456 L1067 1459 L1082 1455 L1094 1443 L1098 1428 L1090 1003 L1086 989 L1077 979 L1072 976Z"}));
})();

let MODE="normal";
const adj={},etype={};for(const k in N)adj[k]=[];
D.edges.forEach(([a,b,t="plano"])=>{adj[a].push(b);adj[b].push(a);etype[a+"|"+b]=etype[b+"|"+a]=t});
const typeOf=(a,b)=>etype[a+"|"+b];
const dist=(a,b)=>Math.hypot(N[a].x-N[b].x,N[a].y-N[b].y);
function cost(a,b){const t=typeOf(a,b),d=dist(a,b);if(t==="escalera")return MODE==="accesible"?Infinity:d*1.6;if(t==="ascensor")return d+LIFT_S*1.2/SCALE_M;return d}
function dijkstra(s,t){const d={},p={},q=new Set(Object.keys(N));for(const k in N)d[k]=Infinity;d[s]=0;
  while(q.size){let u=null;for(const k of q)if(u===null||d[k]<d[u])u=k;if(d[u]===Infinity)break;q.delete(u);if(u===t)break;
    for(const v of adj[u]){const w=cost(u,v);if(d[u]+w<d[v]){d[v]=d[u]+w;p[v]=u}}}
  if(d[t]===Infinity)return null;const path=[t];while(path[0]!==s)path.unshift(p[path[0]]);
  let len=0,stairs=0,lifts=0;for(let i=0;i<path.length-1;i++){len+=dist(path[i],path[i+1]);const ty=typeOf(path[i],path[i+1]);if(ty==="escalera")stairs++;if(ty==="ascensor")lifts++}
  return{path,len,stairs,lifts}}
const meters=u=>Math.max(1,Math.round(u*SCALE_M));
const secs=r=>r.len*SCALE_M/WALK[MODE]+r.lifts*LIFT_S;
const fmtMin=s=>s<60?"1 min":Math.round(s/60)+" min";
const clock=s=>{const d=new Date(Date.now()+s*1000);return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0")};
function turnOf(a,b,c){const v1=[N[b].x-N[a].x,N[b].y-N[a].y],v2=[N[c].x-N[b].x,N[c].y-N[b].y];
  const ang=Math.atan2(v1[0]*v2[1]-v1[1]*v2[0],v1[0]*v2[0]+v1[1]*v2[1])*180/Math.PI;
  if(Math.abs(ang)<30)return["⬆","Sigue derecho"];if(Math.abs(ang)>140)return["⤵","Da la vuelta"];
  if(Math.abs(ang)<60)return ang>0?["⬈","Mantente a la derecha"]:["⬉","Mantente a la izquierda"];
  return ang>0?["➡","Gira a la derecha"]:["⬅","Gira a la izquierda"]}

const box=()=>document.getElementById("stage").getBoundingClientRect();
let V={cx:720,cy:995,w:1180,rot:0};
function fullView(){const b=box(),avail=Math.max(160,b.height-sheetH()-80);const k=Math.max(1330/b.width,1160/avail);
  return{cx:690,cy:1000+(sheetH()-80)*k/2,w:k*b.width,rot:0}}
function sheetH(){return $("sheet").getBoundingClientRect().height||0}
function apply(){const b=box(),h=V.w*b.height/b.width;
  svg.setAttribute("viewBox",`${V.cx-V.w/2} ${V.cy-h/2} ${V.w} ${h}`);
  world.setAttribute("transform",`rotate(${V.rot} ${V.cx} ${V.cy})`);
  const k=V.w/b.width;
  const far=k>1.6;
  mkG.querySelectorAll(".mk,.pin,.me,.org,.ent").forEach(g=>{const x=+g.dataset.x,y=+g.dataset.y;
    g.setAttribute("transform",`translate(${x} ${y}) rotate(${-V.rot}) scale(${k})`);g.classList.toggle("far",far)});
  routeG.querySelectorAll("[data-w]").forEach(p=>p.setAttribute("stroke-width",p.dataset.w*Math.max(k,0.35)));
  routeG.querySelectorAll(".r-flow").forEach(p=>p.setAttribute("stroke-dasharray",`0.1 ${30*Math.max(k,.35)}`));
  const targetPx=80,m=targetPx*k*SCALE_M;const nice=[1,2,5,10,20,25,50,100,200].find(v=>v>=m*0.6)||200;
  $("scaleTxt").textContent=nice+" m";$("scaleBar").style.width=(nice/SCALE_M/k)+"px";
  document.documentElement.style.setProperty("--sheetH",sheetH()+"px");
}
let anim=null;
function animTo(T,ms=500){cancelAnimationFrame(anim);const F={...V},t0=performance.now();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)ms=0;
  let dr=T.rot-F.rot;dr=((dr+540)%360)-180;
  const st=t=>{const k=ms?Math.min(1,(t-t0)/ms):1,e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    V={cx:F.cx+(T.cx-F.cx)*e,cy:F.cy+(T.cy-F.cy)*e,w:F.w+(T.w-F.w)*e,rot:F.rot+dr*e};apply();if(k<1)anim=requestAnimationFrame(st)};
  anim=requestAnimationFrame(st)}
function fitPoints(P){const b=box();let x1=Math.min(...P.map(p=>p.x)),x2=Math.max(...P.map(p=>p.x)),y1=Math.min(...P.map(p=>p.y)),y2=Math.max(...P.map(p=>p.y));
  const avail=b.height-sheetH()-90;const pad=60;let w=Math.max(x2-x1+pad*2,300),h=Math.max(y2-y1+pad*2,260);
  const ar=b.width/avail;if(w/h<ar)w=h*ar;const k=w/b.width;
  const cy=(y1+y2)/2+(sheetH()-60)*k/2;animTo({cx:(x1+x2)/2,cy,w,rot:0})}

function buildMarkers(){mkG.innerHTML="";
  PLACES.forEach(p=>{if(p.node==="a1"||p.node==="a2")return;

      g.appendChild(el("image",{href:p.fotos[0],x:-17,y:-17,width:34,height:34,"clip-path":`url(#${id})`,preserveAspectRatio:"xMidYMid slice"}))}
    else{const t=el("text",{class:"emoji"});t.textContent=p.icon;g.appendChild(t)}

function roundedD(P,rad){P=P.filter((q,i)=>i===0||Math.hypot(q.x-P[i-1].x,q.y-P[i-1].y)>0.5);if(P.length<2)return "M0 0";let d=`M${P[0].x} ${P[0].y}`;
  for(let i=1;i<P.length-1;i++){const a=P[i-1],b=P[i],c=P[i+1],l1=Math.hypot(b.x-a.x,b.y-a.y),l2=Math.hypot(c.x-b.x,c.y-b.y),r=Math.min(rad,l1/2,l2/2);
    d+=` L${(b.x-(b.x-a.x)/l1*r).toFixed(1)} ${(b.y-(b.y-a.y)/l1*r).toFixed(1)} Q${b.x} ${b.y} ${(b.x+(c.x-b.x)/l2*r).toFixed(1)} ${(b.y+(c.y-b.y)/l2*r).toFixed(1)}`}
  const z=P[P.length-1];return d+` L${z.x} ${z.y}`}
function drawRoute(){routeG.innerHTML="";mkG.querySelectorAll(".pin,.me").forEach(e=>e.remove());if(!route)return;
  const P=route.path.map(k=>N[k]),d=roundedD(P,30);
  routeG.appendChild(el("path",{class:"r-case",d,"data-w":16}));
  routeG.appendChild(el("path",{class:"r-main",d,"data-w":10}));
  for(let i=0;i<P.length-1;i++)if(typeOf(route.path[i],route.path[i+1])==="escalera")
    routeG.appendChild(el("line",{class:"r-stairs",x1:P[i].x,y1:P[i].y,x2:P[i+1].x,y2:P[i+1].y,"data-w":10,"stroke-dasharray":"8 7"}));
  routeG.appendChild(el("path",{class:"r-flow",d,"data-w":3.5}));
  routeG.appendChild(el("path",{id:"rDone",class:"r-done",d:"M0 0","data-w":10}));
  const z=P[P.length-1];const pin=el("g",{class:"pin"});pin.dataset.x=z.x;pin.dataset.y=z.y;
  pin.appendChild(el("path",{class:"body",d:"M0 0 C-5 -12 -16 -18 -16 -30 A16 16 0 1 1 16 -30 C16 -18 5 -12 0 0Z"}));
  pin.appendChild(el("circle",{cy:-30,r:6,fill:"#fff"}));mkG.appendChild(pin);
  apply()}

function placeCard(p){return p.fotos.length?`<div class="gal ${p.fotos.length===1?"one":""}">${p.fotos.map((f,i)=>`<img src="${f}" alt="Foto de ${esc(p.name)} ${i+1}" data-full="${i}">`).join("")}</div>`:""}

  card.innerHTML=`<div class="grip"></div><h2>Nivel 1 · Hippocampus</h2><p class="sub">Toca un lugar en el mapa o elige uno. Fotografías del tour incluidas · distancias referenciales.</p>
  <div class="places">${PLACES.filter(p=>p.node!=="a1"&&p.node!=="a2").map(p=>`<button class="pl" data-n="${p.node}">${p.fotos[0]?`<img src="${p.fotos[0]}" alt="">`:`<span class="ph">${p.icon}</span>`}<b>${esc(p.name)}</b></button>`).join("")}</div>`;
  card.querySelectorAll(".pl").forEach(b=>b.onclick=()=>openPlace(b.dataset.n));
  afterSheet(()=>animTo(fullView()))}
function openPlace(n){if(body.classList.contains("nav")||editing)return;dest=n;markSel();const p=PL[n];
  const r=n===origin?null:dijkstra(origin,n);route=r;body.classList.toggle("routing",!!r);drawRoute();
  const info=r?`<div class="eta"><span class="t">${fmtMin(secs(r))}</span><span class="m">≈ ${meters(r.len)} m · llegada ${clock(secs(r))}</span></div>`
    :(n===origin?`<p class="sub">Estás aquí.</p>`:`<p class="sub">${MODE==="accesible"?"No hay ruta sin escaleras hasta aquí en este nivel.":"No hay ruta en este nivel."}</p>`);
  const tags=r?(MODE==="accesible"?`<span class="tag">♿ sin escaleras</span>`:(r.stairs?`<span class="tag">🪜 incluye escalera</span>`:`<span class="tag">sin escaleras</span>`)):"";

   <div class="row" style="margin-bottom:8px"><label for="orig" class="sub" style="margin:0">Desde</label><select id="orig">${[{node:D.youAreHere,name:"Ascensores principales"},...PLACES.filter(x=>x.node!==D.youAreHere)].map(x=>`<option value="${x.node}" ${x.node===origin?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
   ${info}<div>${tags}</div>
   <div class="row" style="margin-top:10px"><button class="btn go" id="startNav" ${r?"":"disabled"}>▶ Iniciar</button></div>`;
  $("closeP").onclick=idle;
  card.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{MODE=b.dataset.m;body.classList.toggle("acc",MODE==="accesible");openPlace(n)});
  $("orig").onchange=e=>{origin=e.target.value;buildMarkers();openPlace(n)};
  $("startNav").onclick=startNav;
  card.querySelectorAll(".gal img").forEach(im=>im.onclick=()=>openViewer(im.src));
  afterSheet(()=>r?fitPoints(r.path.map(k=>N[k]).concat([{x:p.tag.x,y:p.tag.y}])):animTo({cx:p.tag.x,cy:p.tag.y+sheetH()*0.6,w:520,rot:0}))}
function searchSheet(){card.innerHTML=`<div class="grip"></div><div class="row"><h2 style="flex:1">¿A dónde vas?</h2><button class="ctrl" id="closeS" aria-label="Cerrar">✕</button></div>
  <ul class="list">${PLACES.filter(p=>p.node!=="a1"&&p.node!=="a2"&&p.node!==origin).map(p=>{const r=dijkstra(origin,p.node);
    return `<li><button data-n="${p.node}">${p.fotos[0]?`<img src="${p.fotos[0]}" alt="">`:`<span class="ph">${p.icon}</span>`}<span><b>${esc(p.name)}</b><small>${r?meters(r.len)+" m · "+fmtMin(secs(r)):"sin ruta "+(MODE==="accesible"?"accesible":"")}</small></span></button></li>`}).join("")}</ul>`;
  $("closeS").onclick=idle;card.querySelectorAll(".list button").forEach(b=>b.onclick=()=>openPlace(b.dataset.n));afterSheet(()=>{})}

function afterSheet(fn){requestAnimationFrame(()=>{apply();fn()})}

$("viewer").onclick=()=>$("viewer").classList.remove("on");

let navI=0, navT=0, sim=null, navPos=null;
function segLen(i){return dist(route.path[i],route.path[i+1])}
function posAt(i,t){const a=N[route.path[i]],b=N[route.path[i+1]];return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}
function heading(i){const a=N[route.path[i]],b=N[route.path[i+1]];return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI}
function startNav(){if(!route)return;body.classList.add("nav");navI=0;navT=0;
  const me=el("g",{class:"me"});me.appendChild(el("path",{class:"arrow",d:"M0 -18 L13 14 L0 7 L-13 14 Z"}));mkG.appendChild(me);
  renderNav(true)}
function stepInfo(){const P=route.path,i=navI,last=P.length-2;
  const remainSeg=segLen(i)*(1-navT);let ic,txt,cls="";
  const ty=typeOf(P[i],P[i+1]);
  if(ty==="escalera"){ic="🪜";txt=`Toma la escalera hacia ${N[P[i+1]].name}`;cls="stairs"}
  else if(ty==="ascensor"){ic="🛗";txt=`Toma el ascensor hasta ${N[P[i+1]].name}`;cls="lift"}
  else if(i>=last){ic="🏁";txt=`Llegas a ${PL[dest].name}`}
  else{const nt=typeOf(P[i+1],P[i+2]);if(nt==="escalera"){ic="🪜";txt="Luego toma la escalera";cls="stairs"}else{[ic,txt]=turnOf(P[i],P[i+1],P[i+2]);txt+=` hacia ${N[P[i+2]].name}`}}
  let then="";if(i<last-1){const ty2=typeOf(P[i+1],P[i+2]);then=ty2==="plano"&&i+3<P.length?turnOf(P[i+1],P[i+2],P[i+3])[1]:""}
  return{ic,txt,cls,d:meters(remainSeg),then}}
function remaining(){let u=segLen(navI)*(1-navT);for(let i=navI+1;i<route.path.length-1;i++)u+=segLen(i);return u}
function renderNav(jump){const P=route.path;navPos=posAt(navI,navT);
  const me=mkG.querySelector(".me");me.dataset.x=navPos.x;me.dataset.y=navPos.y;
  const done=[...P.slice(0,navI+1).map(k=>N[k]),navPos];$("rDone").setAttribute("d",done.length>1?roundedD(done,30):"M0 0");
  const s=stepInfo(),rem=remaining(),sec=rem*SCALE_M/WALK[MODE];
  const arrived=navI>=P.length-2&&navT>=0.999;
  $("banner").innerHTML=arrived?`<div class="bn arrive"><div class="big">🏁</div><div><div class="dist">Llegaste</div><div class="txt">${esc(PL[dest].name)}</div></div></div>`
    :`<div class="bn ${s.cls}"><div class="big" aria-hidden="true">${s.ic}</div><div><div class="dist">≈ ${s.d} m</div><div class="txt">${esc(s.txt)}</div></div></div>${s.then?`<span class="then">Luego: ${esc(s.then)}</span>`:""}`;
  if(arrived){const p=PL[dest];card.innerHTML=`<div class="grip"></div><h2>Llegaste a ${esc(p.name)}</h2><p class="sub">${esc(p.desc)}</p>${placeCard(p)}<div class="row"><button class="btn go" id="endNav">Terminar</button></div>`;
    $("endNav").onclick=stopNav;card.querySelectorAll(".gal img").forEach(im=>im.onclick=()=>openViewer(im.src))}
  else if(jump||!card.querySelector(".navbar")){card.innerHTML=`<div class="navbar"><div class="eta"><span class="t" id="nT"></span><span class="m" id="nM"></span></div>
     <button class="ctrl" id="prevS" aria-label="Paso anterior">⏮</button><button class="ctrl" id="playS" aria-label="Simular recorrido">▶</button><button class="ctrl" id="nextS" aria-label="Paso siguiente">⏭</button><button class="ctrl btn stop" id="stopN" aria-label="Salir">✕</button></div>
     <p class="sub" style="margin-top:6px">Sin GPS en interiores: avanza con ⏭ o toca ▶ para simular la caminata.</p>`;
    $("prevS").onclick=()=>{pause();if(navT>0.01)navT=0;else navI=Math.max(0,navI-1),navT=0;renderNav()};
    $("nextS").onclick=()=>{pause();if(navI<P.length-2){navI++;navT=0}else navT=1;renderNav()};
    $("playS").onclick=()=>sim?pause():play();$("stopN").onclick=stopNav}
  if(!arrived){$("nT").textContent=fmtMin(sec);$("nM").textContent=`≈ ${meters(rem)} m · ${clock(sec)}`}
  const hd=heading(Math.min(navI,P.length-2)),rot=-(hd+90),wNav=46/SCALE_M;
  const rad=hd*Math.PI/180,ahead=wNav*0.22;const T={cx:navPos.x+Math.cos(rad)*ahead,cy:navPos.y+Math.sin(rad)*ahead,w:wNav,rot};
  if(jump||Math.abs((((V.rot-rot)%360)+540)%360-180)>1)animTo(T,jump?700:450);else{V=T;apply()}
}
function play(){if(sim)return;$("playS").textContent="⏸";let last=performance.now();
  const sp=WALK[MODE]*4/SCALE_M;
  const st=t=>{const dt=(t-last)/1000;last=t;let adv=sp*dt;
    while(adv>0&&!(navI>=route.path.length-2&&navT>=1)){const L=segLen(navI),left=L*(1-navT);
      if(adv<left){navT+=adv/L;adv=0}else{adv-=left;if(navI<route.path.length-2){navI++;navT=0}else{navT=1;adv=0}}}
    renderNav();if(navI>=route.path.length-2&&navT>=1){pause();return}sim=requestAnimationFrame(st)};
  sim=requestAnimationFrame(st)}
function pause(){cancelAnimationFrame(sim);sim=null;const b=$("playS");if(b)b.textContent="▶"}
function stopNav(){pause();body.classList.remove("nav");$("banner").innerHTML="";const n=dest;mkG.querySelector(".me")?.remove();
  V.rot=0;openPlace(n)}

const ptr=new Map();let g0=null;
function toWorld(cx,cy){const b=box(),k=V.w/b.width;const dx=(cx-b.left-b.width/2)*k,dy=(cy-b.top-b.height/2)*k;
  const r=-V.rot*Math.PI/180;return{x:V.cx+dx*Math.cos(r)-dy*Math.sin(r),y:V.cy+dx*Math.sin(r)+dy*Math.cos(r)}}
$("stage").addEventListener("pointerdown",e=>{if(body.classList.contains("nav"))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});g0=null;cancelAnimationFrame(anim)});
window.addEventListener("pointermove",e=>{if(!ptr.has(e.pointerId))return;const prev=ptr.get(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const b=box(),k=V.w/b.width;
  if(ptr.size===1){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;V.cx-=dx*k;V.cy-=dy*k;apply()}
  else if(ptr.size===2){const [a,c]=[...ptr.values()],d=Math.hypot(a.x-c.x,a.y-c.y),m={x:(a.x+c.x)/2,y:(a.y+c.y)/2};
    if(!g0){g0={d,m};return}const f=g0.d/d;const w=Math.min(Math.max(V.w*f,160),2600);const before=toWorld(m.x,m.y);V.w=w;const after=toWorld(m.x,m.y);
    V.cx+=before.x-after.x;V.cy+=before.y-after.y;V.cx-=(m.x-g0.m.x)*V.w/b.width;V.cy-=(m.y-g0.m.y)*V.w/b.width;g0={d,m};apply()}});
const up=e=>{ptr.delete(e.pointerId);g0=null};window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
$("stage").addEventListener("wheel",e=>{if(body.classList.contains("nav"))return;e.preventDefault();const before=toWorld(e.clientX,e.clientY);
  V.w=Math.min(Math.max(V.w*(e.deltaY>0?1.15:1/1.15),160),2600);const after=toWorld(e.clientX,e.clientY);V.cx+=before.x-after.x;V.cy+=before.y-after.y;apply()},{passive:false});
$("recenter").onclick=()=>{if(body.classList.contains("nav"))renderNav(true);else if(route)fitPoints(route.path.map(k=>N[k]));else animTo(fullView())};
window.addEventListener("resize",()=>apply());

const BASE={tags:{},nodes:{}};PLACES.forEach(p=>{BASE.tags[p.node]={x:p.tag.x,y:p.tag.y};BASE.nodes[p.node]={x:N[p.node].x,y:N[p.node].y}});

  PLACES.forEach(p=>{const o=(d&&d.tags&&d.tags[p.node])||BASE.tags[p.node];p.tag.x=o.x;p.tag.y=o.y;

function editSheet(msg){card.innerHTML=`<div class="grip"></div><h2>Ubicar puntos</h2>
  <p class="sub">Arrastra cada <b>círculo con foto</b> al sector del lugar, y su <b>punto amarillo</b> a la puerta de entrada (desde ahí se calcula la ruta). Puedes mover el mapa y hacer zoom.</p>
  <p class="sub" id="eMsg" style="margin-top:6px;font-weight:600">${msg||""}</p>
  <div class="row" style="margin-top:10px"><button class="btn" id="eUndo">↺ Deshacer</button><button class="btn go" id="eSave">💾 Guardar</button><button class="btn" id="eDone">✓ Listo</button></div>`;
  $("eUndo").onclick=()=>{applyPos(savedPos);$("eMsg").textContent="Volviste a la última versión guardada."};
  $("eSave").onclick=saveEdit;$("eDone").onclick=()=>toggleEdit(false);
  afterSheet(()=>{})}
async function saveEdit(){const m=$("eMsg");if(!dbE){m.textContent="No se puede guardar en este momento.";return}
  const d={tags:{},nodes:{},updatedAt:new Date().toISOString()};
  editable().forEach(p=>{const b=BASE.tags[p.node],c=BASE.nodes[p.node];
    if(Math.round(p.tag.x)!==b.x||Math.round(p.tag.y)!==b.y)d.tags[p.node]={x:Math.round(p.tag.x),y:Math.round(p.tag.y)};
    if(Math.round(N[p.node].x)!==c.x||Math.round(N[p.node].y)!==c.y)d.nodes[p.node]={x:Math.round(N[p.node].x),y:Math.round(N[p.node].y)}});
  m.textContent="Guardando…";
  try{await dbE.doc(EKEY).set(d);savedPos=d;m.textContent="Guardado ✓"}catch(e){m.textContent=e&&e.code==="not_granted"?"No tienes permiso para guardar.":"No se pudo guardar. Intenta de nuevo."}}
function toggleEdit(on){editing=on;body.classList.toggle("editing",on);$("editFab").setAttribute("aria-pressed",on);
  if(on){dest=null;route=null;body.classList.remove("routing");routeG.innerHTML="";mkG.querySelectorAll(".pin,.me").forEach(e=>e.remove());markSel();addEnt();editSheet()}
  else{mkG.querySelectorAll(".ent").forEach(e=>e.remove());routeG.innerHTML="";idle()}}
$("editFab").onclick=()=>toggleEdit(!editing);
$("stage").addEventListener("pointerdown",e=>{if(!editing)return;const t=e.target.closest(".mk,.ent");if(!t)return;
  e.stopPropagation();e.preventDefault();const w=toWorld(e.clientX,e.clientY);
  dragItem={el:t,id:e.pointerId,dx:+t.dataset.x-w.x,dy:+t.dataset.y-w.y};},true);
window.addEventListener("pointermove",e=>{if(!dragItem||e.pointerId!==dragItem.id)return;const w=toWorld(e.clientX,e.clientY),x=w.x+dragItem.dx,y=w.y+dragItem.dy,t=dragItem.el,n=t.dataset.node;
  t.dataset.x=x;t.dataset.y=y;
  if(t.classList.contains("mk")){PL[n].tag.x=x;PL[n].tag.y=y}
  else{N[n].x=x;N[n].y=y;refreshFloor();if(n===origin){const o=mkG.querySelector(".org");o.dataset.x=x;o.dataset.y=y}}
  const l=routeG.querySelector(`line[data-n="${n}"]`);if(l){l.setAttribute("x1",PL[n].tag.x);l.setAttribute("y1",PL[n].tag.y);l.setAttribute("x2",N[n].x);l.setAttribute("y2",N[n].y)}
  const m=$("eMsg");if(m)m.textContent="Cambios sin guardar.";apply()});
const endDrag=e=>{if(dragItem&&e.pointerId===dragItem.id)dragItem=null};window.addEventListener("pointerup",endDrag);window.addEventListener("pointercancel",endDrag);
(async()=>{if(window.parent!==window)return;dbE={doc:key=>({
async get(){const raw=localStorage.getItem("navinside:"+key);return{exists:raw!==null,data:()=>raw===null?null:JSON.parse(raw)}},
async set(value){localStorage.setItem("navinside:"+key,JSON.stringify(value))}
})};
  try{const s=await dbE.doc(EKEY).get();if(s.exists){savedPos=s.data();applyPos(savedPos)}}catch(e){}})();
</script>
