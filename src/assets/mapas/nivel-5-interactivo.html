const el=id=>document.getElementById(id);
const photo=el('tourPhoto');
const failed=new Set();
let selected=config.initial;
el('levelLabel').textContent='NIVEL '+config.level;
el('pageTitle').textContent=config.title;
el('sectionsTitle').textContent='Secciones del nivel '+config.level;
document.title='NavInside · Fotografías del tour · Nivel '+config.level;
el('pendingNote').textContent=Object.values(config.places).some(place=>!place.image)?'Las secciones sin fotografía identificada quedan pendientes.':'';
for(const [id,place]of Object.entries(config.places)){
 const button=document.createElement('button');button.type='button';button.dataset.place=id;button.textContent=place.name;button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>selectPlace(id));el('pointList').appendChild(button);
}
function emptyPhoto(unavailable){
 photo.hidden=true;photo.removeAttribute('src');el('sourceBadge').hidden=true;el('emptyState').hidden=false;
 el('emptyTitle').textContent=unavailable?'Fotografía no disponible':'Fotografía pendiente';
 el('emptyText').textContent=unavailable?'La fotografía incluida no pudo mostrarse. Puedes abrir la referencia oficial para consultar el lugar.':'Todavía no se identificó una fotografía propia de esta sección en el tour.';
}
function selectPlace(id){
 const place=config.places[id];if(!place)return;selected=id;
 document.querySelectorAll('[data-place]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.place===id)));
 el('placeTitle').textContent=place.name;el('description').textContent=place.description||'';
 el('sourceLink').hidden=!place.scene;
 if(place.scene)el('sourceLink').href=TOUR+'?sceneId='+encodeURIComponent(place.scene);
 if(!place.image||failed.has(id)){emptyPhoto(failed.has(id));return;}
 photo.alt=place.name+' · fotografía del tour oficial';
 photo.src=PHOTOS[place.image];photo.hidden=false;el('sourceBadge').hidden=false;el('emptyState').hidden=true;
}
photo.addEventListener('error',()=>{failed.add(selected);emptyPhoto(true);});
window.addEventListener('message',event=>{
 if(event.source!==window.parent||event.origin!==window.location.origin||event.data?.type!=='navinside-cursor'||event.data.level!==config.level)return;
 const data=event.data;if(!data.visible){el('routeStatus').hidden=true;return;}
 if(config.places[data.nodeId]){selectPlace(data.nodeId);el('routeStatus').textContent='Recorrido · '+config.places[data.nodeId].name;el('routeStatus').hidden=false;}
});
selectPlace(selected);
</script>
