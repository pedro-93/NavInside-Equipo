name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Keep debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: navinside-debug-signing-v1

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Prepare Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify and prepare APK
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p entrega
          cp "$apk" entrega/NavInside-Actualizada-debug.apk
          sha256sum entrega/NavInside-Actualizada-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavInside-APK-actualizada
          path: entrega/NavInside-Actualizada-debug.apk
          if-no-files-found: error
          retention-days: 30
